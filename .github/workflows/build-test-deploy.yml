name : build-test-deploy

# on: push
on:
  workflow_dispatch:

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   
      - name: run install npm
        working-directory: ./nodejsapp
        run: npm install     

      - name: run audit npm
        working-directory: ./nodejsapp
        run: npm audit --audit-level=high

      - name: run build npm
        working-directory: ./nodejsapp
        run: npm run build
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:      
      - name: checkout repo
        uses: actions/checkout@v4

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   
      - name: run install npm
        working-directory: ./nodejsapp
        run: npm install  
        
      - name: run test placeholder
        working-directory: ./nodejsapp
        run: npm test  

      - name: run lint placeholder
        working-directory: ./nodejsapp
        run: npm run lint        

  deploy:
    needs: test
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: configure github pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: install dependencies
        working-directory: ./nodejsapp
        run: npm install

      - name: build app
        working-directory: ./nodejsapp
        run: npm run build

      - name: upload artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./nodejsapp/out

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4        