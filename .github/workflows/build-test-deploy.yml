name : build-test-deploy

on: push

jobs:
  build: 
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: use node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'   
      - name: run install npm
        working-directory: ./nodejsapp
        run: npm install     

      - name: run audit npm
        working-directory: ./nodejsapp
        run: npm audit --audit-level=high

      - name: run build npm
        working-directory: ./nodejsapp
        run: npm run build